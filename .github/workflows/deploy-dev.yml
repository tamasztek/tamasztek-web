name: Deploy to Dev

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to push alongside latest (e.g. 0.0.1), optional'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tamasztek/tamasztek-web

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ github.event.inputs.version != '' && format('{0}/{1}:{2}', env.REGISTRY, env.IMAGE_NAME, github.event.inputs.version) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Dev VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          script: |
            cd /opt/tamasztek/dev
            docker compose pull tamasztek-web
            docker compose up -d tamasztek-web
