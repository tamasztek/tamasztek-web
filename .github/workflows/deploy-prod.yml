name: Build & Push Prod

# Prod image build + push GHCR-re. Szandekosan NEM deployol a VM-re:
# a prod pre-deploy DB snapshot + pull/restart kezzel, kontrollaltan tortenik
# (lasd .claude/skills/deploy/SKILL.md). A VITE_MODE=prod KOTELEZO, kulonben a
# build a hianyzo .env.production-t keresne a .env.prod helyett.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Prod verzio tag (SemVer, pl. 0.2.0)'
        required: true
        default: '0.0.0'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tamasztek/tamasztek-web

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: false
          build-args: |
            VITE_MODE=prod
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:prod
          cache-from: type=gha
          cache-to: type=gha,mode=max
